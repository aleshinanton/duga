# duga Telegram bot — DeepSeek V3 config
# Run with:
#   export DEEPSEEK_API_KEY="sk-..."
#   export TELEGRAM_BOT_TOKEN="..."
#   cargo run --release -p duga-telegram-bot -- --config duga-deepseek.yaml

provider: "openai"
model: "deepseek-v4-flash"

# DeepSeek V3 chat model (no thinking — avoids reasoning_content roundtrip).
thinking_level: "medium"
context_window: 1000000

agent:
  limits:
    max_steps: 30
    max_tool_calls: 60
    max_runtime: 15m
    retry_on_error: 3
  features:
    streaming: true
  output:
    max_stdout_bytes: 8192
    max_stderr_bytes: 8192
    max_combined_bytes: 16384
  think:
    max_calls: 8
    max_tokens: 8192

sandbox:
  mode: "docker"
  container: "duga-sandbox"
  workspace_mount: "/workspace"
  allow_all_binaries: true
  timeout: 60s

workspace:
  root: "~/duga-workspace"

environment:
  allowed:
    - HOME
    - PATH
    - CARGO_HOME
    - RUSTUP_HOME
    - DEEPSEEK_API_KEY
    - OPENAI_API_KEY
    - ANTHROPIC_API_KEY
    - GIT_AUTHOR_NAME
    - GIT_AUTHOR_EMAIL
    - GIT_COMMITTER_NAME
    - GIT_COMMITTER_EMAIL

memory:
  max_tokens: 32768
  compress_at_ratio: 0.8

plugins:
  dir: "./plugins"
  modules: []

frontend:
  progress_mode: "summary"
  confirmation_timeout: 60s

telegram:
  token_env: "TELEGRAM_BOT_TOKEN_OPENWRT"
  allowed_chat_usernames:
    # Your Telegram @username (without @)
    - antonaleshin
  send_tool_events: true
  send_final_only: false
  events_dir: "./events"
  skills_dir: "./skills"
  data_dir: "./data"
  attachments:
    enabled: true
    max_file_size_mb: 50
    download_dir: "attachments"
