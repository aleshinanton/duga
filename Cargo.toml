[workspace]
resolver = "2"
members = [
    "crates/*",
    "crates/duga-tui",
    "crates/duga-runtime",
    "crates/duga-telegram-bot",
    "crates/duga-tools-builtin",
]

[workspace.package]
edition = "2021"
rust-version = "1.77"

[workspace.dependencies]
pulldown-cmark = { version = "0.13", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true
