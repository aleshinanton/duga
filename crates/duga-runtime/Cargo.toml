[package]
name = "duga-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Shared runtime composition for duga frontends (CLI, Telegram, TUI)"
license = "MIT"

[dependencies]
duga-config = { path = "../duga-config" }
duga-core = { path = "../duga-core" }
duga-events = { path = "../duga-events" }
duga-llm = { path = "../duga-llm" }
duga-plugin-host = { path = "../duga-plugin-host" }
duga-sandbox = { path = "../duga-sandbox" }
duga-tools = { path = "../duga-tools" }
duga-tools-builtin = { path = "../duga-tools-builtin" }
duga-types = { path = "../duga-types" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "macros"] }
tracing = "0.1"
which = "8"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
