[package]
name = "duga-telegram-bot"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Telegram bot frontend for duga agent runtime"
license = "MIT"

[dependencies]
duga-config = { path = "../duga-config" }
duga-core = { path = "../duga-core" }
duga-events = { path = "../duga-events" }
duga-llm = { path = "../duga-llm" }
duga-runtime = { path = "../duga-runtime" }
duga-sandbox = { path = "../duga-sandbox" }
duga-tools = { path = "../duga-tools" }
duga-tools-builtin = { path = "../duga-tools-builtin" }
duga-types = { path = "../duga-types" }
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
cron = "0.16"
dashmap = "6"
notify = { version = "8", default-features = false, features = ["macos_kqueue"] }
schemars = { version = "1", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
teloxide = { version = "0.17", default-features = false, features = ["rustls", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
pulldown-cmark = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
duga-core = { path = "../duga-core", features = [] }
duga-events = { path = "../duga-events" }
duga-llm = { path = "../duga-llm" }
duga-sandbox = { path = "../duga-sandbox" }
duga-tools = { path = "../duga-tools" }
duga-types = { path = "../duga-types" }
serde_json = "1"
tempfile = "3"
