[package]
name = "duga-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Core loop and memory primitives for duga"
license = "MIT OR Apache-2.0"

[dependencies]
duga-types = { path = "../duga-types" }
duga-llm = { path = "../duga-llm" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
