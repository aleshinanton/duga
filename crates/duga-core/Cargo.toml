[package]
name = "duga-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Core loop and memory primitives for duga"
license = "MIT"

[dependencies]
duga-types = { path = "../duga-types" }
duga-llm = { path = "../duga-llm" }
duga-events = { path = "../duga-events" }
duga-sandbox = { path = "../duga-sandbox" }
duga-tools = { path = "../duga-tools" }
tokio = { version = "1", features = ["time"] }
tracing = "0.1"
schemars = { version = "1", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
tempfile = "3"
duga-replay = { path = "../duga-replay" }
