[package]
name = "duga-sandbox"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Capability-based sandboxing for the duga agent runtime"
license = "MIT"

[dependencies]
duga-types = { path = "../duga-types" }
cap-std = "4"
tokio = { version = "1", features = ["process", "rt", "sync", "time", "macros", "io-util"] }
which = "8"
tracing = "0.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
glob = "0.3"

[dev-dependencies]
tokio-test = "0.4"