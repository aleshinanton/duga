[package]
name = "duga-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "MCP (Model Context Protocol) proxy adapter — connects duga to external MCP servers via a single proxy tool"
license = "MIT"

[dependencies]
async-trait = "0.1"
duga-config = { path = "../duga-config" }
duga-sandbox = { path = "../duga-sandbox" }
duga-tools = { path = "../duga-tools" }
duga-types = { path = "../duga-types" }
hex = "0.4"
regex = "1"
rust-mcp-sdk = { version = "0.9", default-features = false, features = ["client", "stdio", "streamable-http"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "macros", "process", "fs", "rt"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"
