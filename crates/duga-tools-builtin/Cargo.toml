[package]
name = "duga-tools-builtin"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Built-in tools for duga: read, write, edit, shell, search, think"
license = "MIT"

[dependencies]
duga-tools = { path = "../duga-tools" }
duga-sandbox = { path = "../duga-sandbox" }
duga-types = { path = "../duga-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["uuid1"] }
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread"] }
tracing = "0.1"
thiserror = "2"
regex = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"

[dev-dependencies]
tokio-test = "0.4"
