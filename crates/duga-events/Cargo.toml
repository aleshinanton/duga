[package]
name = "duga-events"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Event types and sinks for duga"
license = "MIT OR Apache-2.0"

[dependencies]
duga-types = { path = "../duga-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
