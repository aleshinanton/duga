[package]
name = "duga-tools"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Tool trait system and dispatcher for duga"
license = "MIT"

[dependencies]
duga-types = { path = "../duga-types" }
duga-sandbox = { path = "../duga-sandbox" }
duga-events = { path = "../duga-events" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = [] }
jsonschema = "0.46"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
