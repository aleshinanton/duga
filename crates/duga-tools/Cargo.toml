[package]
name = "duga-tools"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Tool trait system and dispatcher for duga"
license = "MIT OR Apache-2.0"

[dependencies]
duga-types = { path = "../duga-types" }
duga-sandbox = { path = "../duga-sandbox" }
duga-events = { path = "../duga-events" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "0.8", features = ["uuid1"] }
jsonschema = "0.26"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
thiserror = "1"

[dev-dependencies]
tempfile = "3"
